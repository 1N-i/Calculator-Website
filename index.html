<html>
    <head>
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <table border="1">
            <tr>
                <td colspan="4" id="screen"></td>
            </tr>
            
            <tr>
                <td><button onclick="once()">ON/CE</button></td>
                <td><button onclick="saveMemory()">MRC</button></td>
                <td><button onclick="saveNegative()">M-</button></td>
                <td><button onclick="savePositive()">M+</button></td>
            </tr>
            <tr>
                <td><button onclick="off()">OFF</button></td>
                <td><button onclick="rootSquare()" class="bigger">√</button></td>
                <td><button onclick="percentage()"><b>%</b></button></td>
                <td><button onclick="divide()" class="bigger">÷</button></td>
            </tr>
            <tr>
                <td><button onclick="add_(7)">7</button></td>
                <td><button onclick="add_(8)">8</button></td>
                <td><button onclick="add_(9)">9</button></td>
                <td><button onclick="multiply()"><b>X</b></button></td>
            </tr>
            <tr>
                <td><button onclick="add_(4)">4</button></td>
                <td><button onclick="add_(5)">5</button></td>
                <td><button onclick="add_(6)">6</button></td>
                <td><button onclick="subtract()" class="bigger">-</button></td>
            </tr>
            <tr>
                <td><button onclick="add_(1)">1</button></td>
                <td><button onclick="add_(2)">2</button></td>
                <td><button onclick="add_(3)">3</button></td>
                <td rowspan="2"><button onclick="plus()" class="bigger">+</button></td>
            </tr>
            <tr>
                <td><button onclick="add_(0)">0</button></td>
                <td><button onclick="addDot()" id="dot">.</button></td>
                <td><button onclick="seeResult()">=</button></td>
            </tr>
        </table>
        
        <script src="script.js"></script>
    </body>
</html>
